spring:
  application:
    name: mercado-express-security
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mercado_express_cp5_security}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8083}

app:
  admin:
    nome: ${ADMIN_NOME:Administrador}
    email: ${ADMIN_EMAIL:admin@mercadoexpress.com}
    senha: ${ADMIN_SENHA:admin123}
