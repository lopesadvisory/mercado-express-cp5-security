<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mercado Express - Entrar</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex align-items-center" style="min-height: 100vh; background-color: #f4f4f4;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="h4 mb-3 text-center">Mercado Express</h1>
                    <p class="text-center text-muted">Entrar na sua conta</p>

                    <div th:if="${param.error}" class="alert alert-danger">E-mail ou senha inválidos.</div>
                    <div th:if="${param.logout}" class="alert alert-success">Sessão encerrada com sucesso.</div>
                    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">E-mail</label>
                            <input type="email" name="username" class="form-control" autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Senha</label>
                            <input type="password" name="password" class="form-control">
                        </div>
                        <button type="submit" id="entrar" class="btn btn-primary w-100">Entrar</button>
                    </form>

                    <p class="text-center mt-3 mb-0">
                        Não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a>
                    </p>
                    <a class="btn btn-link w-100" th:href="@{/}">Voltar para a página inicial</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
