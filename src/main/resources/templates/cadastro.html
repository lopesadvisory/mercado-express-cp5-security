<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mercado Express - Criar conta</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex align-items-center" style="min-height: 100vh; background-color: #f4f4f4;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="h4 mb-3 text-center">Criar conta</h1>
                    <p class="text-center text-muted">Cadastre-se para acessar o Mercado Express</p>

                    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

                    <form th:action="@{/cadastro}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Nome</label>
                            <input type="text" name="nome" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">E-mail</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Senha</label>
                            <input type="password" name="senha" class="form-control" required minlength="6">
                        </div>
                        <button type="submit" id="cadastrar" class="btn btn-primary w-100">Criar conta</button>
                    </form>

                    <p class="text-center mt-3 mb-0">
                        Já tem conta? <a th:href="@{/login}">Entrar</a>
                    </p>
                    <a class="btn btn-link w-100" th:href="@{/}">Voltar para a página inicial</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
