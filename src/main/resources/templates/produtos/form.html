<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modoEdicao} ? 'Mercado Express - Editar Produto' : 'Mercado Express - Novo Produto'"></title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container">
    <h1 class="mb-4" th:text="${modoEdicao} ? 'Editar produto' : 'Novo produto'"></h1>

    <form class="bg-white shadow-sm p-4 rounded" style="max-width: 480px;"
          th:object="${produto}"
          th:action="${modoEdicao} ? @{/produtos/{id}/editar(id=${produto.id})} : @{/produtos}"
          method="post">

        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" th:field="*{nome}">
            <div class="text-danger small" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Tipo</label>
            <input type="text" class="form-control" th:field="*{tipo}">
            <div class="text-danger small" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Setor</label>
            <input type="text" class="form-control" th:field="*{setor}">
            <div class="text-danger small" th:if="${#fields.hasErrors('setor')}" th:errors="*{setor}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Tamanho</label>
            <input type="text" class="form-control" th:field="*{tamanho}">
            <div class="text-danger small" th:if="${#fields.hasErrors('tamanho')}" th:errors="*{tamanho}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Preço</label>
            <input type="number" step="0.01" class="form-control" th:field="*{preco}">
            <div class="text-danger small" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}"></div>
        </div>

        <button type="submit" id="salvar" class="btn btn-primary">Salvar</button>
        <a class="btn btn-outline-secondary" th:href="@{/produtos}">Cancelar</a>
    </form>
</div>
</body>
</html>
